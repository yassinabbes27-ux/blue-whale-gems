<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Collection | BLUE WHALE GEMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#b9dceb;--blue-dark:#7895a3;--green:#245344;--ink:#25363d;--muted:#7b898e;--line:#e9eef0}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
body[dir="rtl"]{font-family:"Cairo",Arial,sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1160px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-family:"Playfair Display",serif;font-size:16px;letter-spacing:2px;font-weight:500}
.logo small{display:block;font-family:"DM Sans",sans-serif;font-size:9px;letter-spacing:4px;color:var(--blue-dark);margin-top:5px}
.lang{border:1px solid #dce8ec;background:white;color:var(--green);padding:8px 12px;border-radius:2px;font-size:11px;cursor:pointer}
main{max-width:1160px;margin:auto;padding:32px 20px 70px}
.back{display:inline-block;margin-bottom:28px;color:var(--blue-dark);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.heading{text-align:center;margin:5px 0 38px}
.eyebrow{font-size:9px;letter-spacing:3px;color:var(--blue-dark);font-weight:600;text-transform:uppercase}
h1{margin:14px 0 10px;font-family:"Playfair Display",serif;font-size:clamp(32px,5vw,45px);font-weight:400}
body[dir="rtl"] h1{font-family:"Cairo",sans-serif}
.heading p{color:var(--muted);font-size:12px;line-height:1.9}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:35px 19px}
.product{min-width:0}
.product a{display:block}
.product-image{aspect-ratio:1/1.12;background:#fff;overflow:hidden;border-radius:4px}
.product-image img{width:100%;height:100%;display:block;object-fit:contain;border-radius:4px;box-shadow:none;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.product a:hover img{transform:scale(1.045)}
.product a:active img{transform:scale(.96)}
.product h2{margin:14px 0 8px;font-family:"Playfair Display",serif;font-size:15px;line-height:1.55;font-weight:400}
.product .price{color:var(--green);font-size:13px;font-weight:600}
.delivery{display:block;margin-top:7px;color:#89979d;font-size:10px}
.unavailable{height:100%;display:flex;align-items:center;justify-content:center;color:#89979d;font-size:11px}
footer{border-top:1px solid var(--line);text-align:center;padding:29px 15px;color:#89979d;font-size:9px;letter-spacing:1.5px}
footer strong{display:block;color:var(--ink);font-family:"Playfair Display",serif;font-size:15px;font-weight:400;letter-spacing:2px;margin-bottom:8px}
body[dir="rtl"] .eyebrow,body[dir="rtl"] .back{letter-spacing:0}
.product-image img{transition:transform .25s ease;opacity:1;transform:none}
.product a:hover .product-image img{transform:scale(1.025)}
@media(prefers-reduced-motion:reduce){.product-image img{transition:none!important;transform:none!important}}
@media(max-width:700px){.nav{padding:13px}.logo{font-size:12px}main{padding:23px 13px 50px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:27px 12px}.product h2{font-size:13px}h1{font-size:32px}}
</style>
</head>
<body>
<header>
 <div class="nav">
  <a class="logo" href="index.html">BLUE WHALE GEMS<small>NATURAL BEAUTY</small></a>
  <button class="lang" type="button" onclick="toggleLanguage()">العربية</button>
 </div>
</header>
<main>
 <a class="back" href="index.html#collections" data-en="← All collections" data-ar="→ جميع المجموعات">← All collections</a>
 <div class="heading">
  <div class="eyebrow">BLUE WHALE GEMS · THE COLLECTION</div>
  <h1 id="collectionTitle">Collection</h1>
  <p id="collectionDescription"></p>
 </div>
 <div class="products" id="productsGrid"></div>
</main>
<footer><strong>BLUE WHALE GEMS</strong><span data-en="NATURAL GEMSTONES · TUNISIA" data-ar="أحجار طبيعية · تونس">NATURAL GEMSTONES · TUNISIA</span></footer>
<script>
const groups={
bracelets:{en:"Bracelets",ar:"الأساور",descEn:"A collection of natural gemstone bracelets.",descAr:"مجموعة من الأساور المصنوعة من الأحجار الطبيعية."},
necklaces:{en:"Necklaces",ar:"القلائد",descEn:"Pendants and necklaces shaped by nature.",descAr:"قلائد وقطع تتزيّن بجمال الأحجار الطبيعية."},
rings:{en:"Rings",ar:"الخواتم",descEn:"Gemstone rings set in sterling silver.",descAr:"خواتم من الأحجار الطبيعية والفضة."},
"raw-gems":{en:"Raw Gems Collection",ar:"الأحجار الخام",descEn:"Natural stones in their original form.",descAr:"أحجار طبيعية في هيئتها الأصلية."}
};
const category=new URLSearchParams(location.search).get("category");
const group=groups[category];
const title=document.getElementById("collectionTitle");
const description=document.getElementById("collectionDescription");
const grid=document.getElementById("productsGrid");
async function loadProducts(){
 const response=await fetch("data/products.json");
 if(!response.ok)throw new Error("Could not load product catalogue");
 const products=await response.json();
 if(!group){
  title.textContent="Collection not found";
  description.textContent="Please return to the collections page.";
 }else{
  title.textContent=group.en;
  description.dataset.en=group.descEn;
  description.dataset.ar=group.descAr;
  products.filter(p=>p.category===category).forEach(p=>{
   const imagePath=String(p.image||"").replace(/^\/+/, "");
   const params=new URLSearchParams({name:p.name,price:String(p.price),image:imagePath,delivery:String(p.delivery??8),stock:String(p.stock??1),category:p.category});
   const card=document.createElement("article");
   card.className="product";
   const link=document.createElement("a");
   link.href="product.html?"+params.toString();
   const frame=document.createElement("div");
   frame.className="product-image";
   const img=document.createElement("img");
   const originalImageUrl="https://raw.githubusercontent.com/yassinabbes27-ux/blue-whale-gems/main/"+imagePath;
   const optimizedImageUrl="https://wsrv.nl/?url="+encodeURIComponent(originalImageUrl)+"&w=640&output=webp&q=82&maxage=1y";
   img.alt=p.name;
   img.loading=products.filter(item=>item.category===category).indexOf(p)<(window.matchMedia("(max-width:700px)").matches?2:4)?"eager":"lazy";
   img.decoding="async";
   img.fetchPriority=img.loading==="eager"?"high":"low";
   img.src=optimizedImageUrl;
   img.onerror=()=>{if(img.src!==originalImageUrl){img.src=originalImageUrl;return;}frame.innerHTML='<div class="unavailable">Image unavailable</div>'};
   frame.appendChild(img);
   const name=document.createElement("h2");
   name.textContent=p.name;
   const price=document.createElement("div");
   price.className="price";
   price.textContent=p.price+" TND";
   const delivery=document.createElement("span");
   delivery.className="delivery";
   delivery.dataset.en="Delivery · "+p.delivery+" TND";
   delivery.dataset.ar="التوصيل · "+p.delivery+" د.ت";
   delivery.textContent=delivery.dataset.en;
   link.append(frame,name,price,delivery);
   card.appendChild(link);
   grid.appendChild(card);
  });
 }
}
function setupReveal(){
 if(!("IntersectionObserver" in window)||window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const items=document.querySelectorAll(".heading > *");
 items.forEach(item=>{item.style.opacity="1";item.style.transform="none";});
}
function applyLanguage(lang){
 localStorage.setItem("bwg-language",lang);
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.body.dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-en][data-ar]").forEach(el=>el.textContent=el.dataset[lang]);
 document.querySelector(".lang").textContent=lang==="ar"?"English":"العربية";
 if(group){
  title.textContent=group[lang];
  description.textContent=lang==="ar"?group.descAr:group.descEn;
 }
}
function toggleLanguage(){applyLanguage((localStorage.getItem("bwg-language")||"en")==="en"?"ar":"en")}
applyLanguage(localStorage.getItem("bwg-language")||"en");
if(group)document.title=group.en+" | BLUE WHALE GEMS";
loadProducts().then(()=>{applyLanguage(localStorage.getItem("bwg-language")||"en");setupReveal();}).catch(()=>{title.textContent="Collection unavailable";description.textContent="Please refresh the page in a moment.";});
</script>
</body>
</html>
