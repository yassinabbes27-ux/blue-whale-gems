
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE WHALE GEMS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:#f8fcfd;color:#173b4b}
header{padding:24px 7%;display:flex;justify-content:space-between;align-items:center;background:white}
.logo{font-size:21px;letter-spacing:3px;font-weight:bold}
nav a{color:#315b6a;text-decoration:none;margin-left:18px;font-family:Arial}
.hero{text-align:center;padding:85px 20px;background:linear-gradient(140deg,#e8f6fa,#fff)}
.hero h1{font-size:38px;letter-spacing:4px;margin:0 0 15px}
.hero p{color:#63818c;font-family:Arial;letter-spacing:1px}
.section{padding:55px 7%;max-width:1100px;margin:auto}
.section h2{text-align:center;font-size:29px;font-weight:normal}
.product{max-width:340px;margin:35px auto;background:white;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #173b4b12;transition:.25s}
.product:hover{transform:translateY(-5px)}
.product a{text-decoration:none;color:inherit;display:block}
.product img{width:100%;height:300px;object-fit:cover;display:block}
.product-info{padding:22px;text-align:center}
.product-info h3{font-size:19px;font-weight:normal;line-height:1.5}
.price{font-family:Arial;font-size:20px;color:#997b4b;font-weight:bold}
.view{display:inline-block;margin-top:15px;padding:12px 24px;background:#173f50;color:white;border-radius:30px;font-family:Arial;font-size:13px}
footer{text-align:center;padding:30px;background:#eaf5f8;color:#68828c;font-family:Arial;font-size:12px;letter-spacing:2px}
@media(max-width:600px){header{padding:20px;flex-direction:column;gap:15px}.hero h1{font-size:28px}}
</style>
</head>
<body>

<header>
  <div class="logo">BLUE WHALE GEMS</div>
  <nav><a href="#collection">COLLECTION</a></nav>
</header>

<section class="hero">
  <h1>THE BEAUTY OF NATURE</h1>
  <p>Natural gemstones · Timeless elegance</p>
</section>

<section class="section" id="collection">
  <h2>Our Collection</h2>

  <div class="product">
    <a href="product.html">
      <img src="images/20261018_184933.jpg"
      alt="Aquamarine Amethyst Labradorite Bracelet">
      <div class="product-info">
        <h3>Aquamarine + Amethyst + Labradorite Bracelet</h3>
        <div class="price">70 TND</div>
        <span class="view">VIEW DETAILS</span>
      </div>
    </a>
  </div>
</section>

<footer>
  BLUE WHALE GEMS · THE WORLD OF NATURAL BEAUTY
</footer>

</body>
</html>
