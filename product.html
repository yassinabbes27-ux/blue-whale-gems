
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLUE WHALE GEMS | Product</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#263c39;font-family:Georgia,serif}
header{padding:22px 7%;border-bottom:1px solid #eeeae2}
.logo{text-decoration:none;color:#263c39;text-align:center;display:block;font-size:21px;letter-spacing:4px}
.logo small{display:block;font:9px Arial;letter-spacing:5px;color:#ad9569;margin-top:5px}
main{max-width:1050px;margin:45px auto;padding:0 25px}
.back{font:12px Arial;color:#858780;text-decoration:none}
.details{display:grid;grid-template-columns:1.05fr .95fr;gap:55px;align-items:center;margin-top:35px}
.photo{background:#f8f7f3;padding:13px;border-radius:5px}
.photo img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.eyebrow{font:10px Arial;letter-spacing:3px;color:#ad9569}
h1{font-size:32px;line-height:1.5;font-weight:normal;margin:17px 0}
.description{font:14px/2 Arial;color:#777970}
.price{font:bold 27px Arial;color:#ad9569;margin:25px 0}
.shipping{background:#f8f7f3;padding:20px;border:1px solid #eeeae2;font:14px/2.2 Arial;color:#656960}
.total{border-top:1px solid #e5e0d6;padding-top:10px;margin-top:8px;font-weight:bold;color:#263c39}
.order{display:block;background:#254c42;color:#fff;text-decoration:none;text-align:center;padding:17px 15px;margin-top:25px;border-radius:3px;font:12px Arial;letter-spacing:1.5px}
.order:hover{background:#17372f}
.note{font:11px/1.8 Arial;color:#92938c;margin-top:13px}
footer{text-align:center;border-top:1px solid #eeeae2;margin-top:70px;padding:30px;font:10px Arial;letter-spacing:2px;color:#858780}
@media(max-width:700px){main{margin:28px auto}.details{grid-template-columns:1fr;gap:25px}h1{font-size:26px}}
</style>
</head>
<body>
<header>
<a href="index.html" class="logo">BLUE WHALE <small>G E M S</small></a>
</header>

<main>
<a href="index.html" class="back">← BACK TO COLLECTION</a>

<div class="details">
<div class="photo" id="photo"></div>

<div>
<div class="eyebrow">BLUE WHALE GEMS · COLLECTION</div>
<h1 id="name"></h1>
<p class="description" id="description"></p>
<div class="price" id="price"></div>
<div class="shipping" id="shipping"></div>

<a class="order" id="order" href="index.html">CONTACT TO ORDER</a>
<p class="note">للاستفسار عن المنتج أو إتمام الطلب، يسعدنا التواصل معك.</p>
</div>
</div>
</main>

<footer>BLUE WHALE GEMS · THE BEAUTY OF NATURAL GEMSTONES</footer>

<script>
const products={
 bracelet:{
  name:"Aquamarine + Amethyst + Labradorite Bracelet",
  description:"ثلاثة أحجار مختلفة في اللون والتفاصيل، اجتمعت في سوار واحد. اختيار جميل لمن يحب تنسيق الألوان الطبيعية في إطلالته.",
  price:70,
  delivery:8,
  image:"images/20261018_184933.jpg"
 },
 tiger:{name:"Tiger's Eye",description:"حجر يتميز بدرجاته البنية والذهبية وانعكاساته المميزة.",price:null},
 amethyst:{name:"Amethyst",description:"حجر بنفسجي اللون، يتميز بدرجاته وتفاصيله الجميلة.",price:null},
 turquoise:{name:"Turquoise",description:"حجر يتميز بألوانه الزرقاء والخضراء.",price:null},
 coral:{name:"Natural Coral",description:"قطعة من المرجان الطبيعي.",price:null}
};

const id=new URLSearchParams(location.search).get("id")||"bracelet";
const p=products[id]||products.bracelet;

document.title=p.name+" | BLUE WHALE GEMS";
document.getElementById("name").textContent=p.name;
document.getElementById("description").textContent=p.description;
document.getElementById("price").textContent=p.price===null?"Price to be added":p.price+" TND";

const photo=document.getElementById("photo");
if(p.image){
 const img=document.createElement("img");
 img.src=p.image;
 img.alt=p.name;
 photo.appendChild(img);
}else{
 photo.style.minHeight="320px";
 photo.style.display="grid";
 photo.style.placeItems="center";
 photo.textContent=p.name.toUpperCase();
}

const shipping=document.getElementById("shipping");
if(p.price!==null && p.delivery!==undefined){
 shipping.innerHTML=
 "Product price: "+p.price+" TND<br>"+
 "Delivery: "+p.delivery+" TND"+
 '<div class="total">TOTAL: '+(p.price+p.delivery)+' TND</div>';
}else{
 shipping.textContent="Price and delivery details will be announced.";
}
</script>
</body>
</html>
