<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>BLUE WHALE GEMS | Product</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#20333b;font-family:Arial,Helvetica,sans-serif}
header{padding:20px;border-bottom:1px solid #edf1f3;text-align:center}
.logo{color:#20333b;text-decoration:none;font-weight:bold;letter-spacing:3px;font-size:17px}
.logo small{display:block;font-size:9px;letter-spacing:5px;color:#7795a3;margin-top:5px}
main{max-width:1050px;margin:35px auto;padding:0 20px}
.back{font-size:12px;color:#71828a;text-decoration:none}
.details{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center;margin-top:30px}
.photo{background:#f3f9fc;border-radius:16px;padding:12px;overflow:hidden}
.photo img{width:100%;display:block;aspect-ratio:1/1;object-fit:contain;border-radius:10px}
.eyebrow{font-size:10px;letter-spacing:3px;color:#7795a3;font-weight:bold}
h1{font:normal 30px/1.4 Georgia,serif;margin:16px 0}
.description{font-size:14px;line-height:1.9;color:#71828a}
.price{font-size:25px;font-weight:bold;color:#245344;margin:22px 0}
.shipping{background:#f3f9fc;padding:18px;border-radius:10px;font-size:14px;line-height:2;color:#536a73}
.total{border-top:1px solid #dceaf0;margin-top:8px;padding-top:8px;font-weight:bold;color:#20333b}
.order{display:block;background:#a9e8c5;color:#174b35;text-align:center;text-decoration:none;padding:17px 14px;border-radius:9px;margin-top:22px;font-size:13px;font-weight:bold;letter-spacing:1px;transition:.2s}
.order:hover{background:#8bd9ae;transform:translateY(-2px)}
.note{font-size:12px;line-height:1.8;color:#71828a;margin-top:13px}
footer{text-align:center;border-top:1px solid #edf1f3;margin-top:65px;padding:25px;font-size:10px;letter-spacing:2px;color:#809099}
@media(max-width:700px){
 main{margin:25px auto;padding:0 15px}
 .details{grid-template-columns:1fr;gap:24px}
 h1{font-size:25px}
}
</style>
</head>
<body>

<header>
<a href="index.html" class="logo">BLUE WHALE GEMS
<small>NATURAL BEAUTY</small></a>
</header>

<main>
<a href="index.html" class="back">← BACK TO COLLECTION</a>

<div class="details">
<div class="photo" id="photo"></div>

<div>
<div class="eyebrow">BLUE WHALE GEMS · COLLECTION</div>
<h1 id="name"></h1>
<p class="description" id="description"></p>
<div class="price" id="price"></div>
<div class="shipping" id="shipping"></div>

<a class="order" id="order"
href="https://wa.me/message/RHFJOGTPA2UXC1"
target="_blank" rel="noopener">
ORDER VIA WHATSAPP
</a>

<p class="note" id="note">
لإتمام الطلب، أرسل لنا اسم القطعة الظاهر في هذه الصفحة عبر واتساب.
</p>
</div>
</div>
</main>

<footer>
BLUE WHALE GEMS · NATURAL GEMSTONES · TUNISIA
</footer>

<script>
const params = new URLSearchParams(window.location.search);

const name = params.get("name") || "BLUE WHALE GEMS Product";
const priceValue = Number(params.get("price"));
const hasPrice = params.has("price") && Number.isFinite(priceValue);
const image = params.get("image") || "";
const deliveryValue = Number(params.get("delivery"));
const hasDelivery = params.has("delivery") &&
Number.isFinite(deliveryValue) && deliveryValue >= 0;

document.title = name + " | BLUE WHALE GEMS";

document.getElementById("name").textContent = name;
document.getElementById("description").textContent =
"قطعة مختارة من BLUE WHALE GEMS، تتميز بجمال الحجر الطبيعي وألوانه وتفاصيله الخاصة.";

document.getElementById("price").textContent =
hasPrice ? priceValue + " TND" : "Price on request";

const photo = document.getElementById("photo");

if (image.startsWith("images/")) {
 const img = document.createElement("img");
 img.src = image;
 img.alt = name;
 img.onerror = function(){
  photo.textContent = "Image unavailable";
  photo.style.padding = "50px 15px";
  photo.style.textAlign = "center";
 };
 photo.appendChild(img);
} else {
 photo.textContent = "Product image unavailable";
 photo.style.padding = "50px 15px";
}

const shipping = document.getElementById("shipping");

if (hasPrice && hasDelivery) {
 shipping.innerHTML =
 "Product price: " + priceValue + " TND<br>" +
 "Delivery: " + deliveryValue + " TND" +
 '<div class="total">TOTAL: ' +
 (priceValue + deliveryValue) + " TND</div>";
} else if (hasPrice) {
 shipping.textContent =
 "Product price: " + priceValue +
 " TND. Delivery fee will be confirmed when ordering.";
} else {
 shipping.textContent =
 "Contact us for product price and delivery details.";
}
</script>

</body>
</html>
